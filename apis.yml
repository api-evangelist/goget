aid: goget
name: GoGet
description: >-
  GoGet is a Malaysian on-demand workforce and delivery technology company whose
  network of verified workers, called GoGetters, powers same-day delivery,
  dispatch, and blended-workforce staffing for more than 10,000 businesses across
  Klang Valley, Penang, Negeri Sembilan and Johor Bahru. Beyond its consumer and
  business apps, GoGet exposes the GoGet Delivery API so merchants can automate
  on-demand deliveries end to end — create and manage jobs, estimate delivery
  fees, verify coverage and availability, track GoGetters live, and receive job
  lifecycle events via webhooks. Integration is free and typically completed in
  one to two weeks. GoGet is backed by 500 Global.
